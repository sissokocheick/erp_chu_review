{% load custom_filters %}
<div class="pag-bar">
  <span class="pag-info">{{ page_obj.start_index }} – {{ page_obj.end_index }} / {{ page_obj.paginator.count }}</span>
  <div class="pag-ctrl">
    {% if page_obj.has_previous %}
      <a class="pag-link" href="{{ paginator_url }}&page=1{% if q %}&q={{ q }}{% endif %}&per_page={{ per_page }}">&laquo; Premier</a>
      <a class="pag-link" href="{{ paginator_url }}&page={{ page_obj.previous_page_number }}{% if q %}&q={{ q }}{% endif %}&per_page={{ per_page }}">Prec.</a>
    {% endif %}
    <span class="pag-cur">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a class="pag-link" href="{{ paginator_url }}&page={{ page_obj.next_page_number }}{% if q %}&q={{ q }}{% endif %}&per_page={{ per_page }}">Suiv.</a>
      <a class="pag-link" href="{{ paginator_url }}&page={{ page_obj.paginator.num_pages }}{% if q %}&q={{ q }}{% endif %}&per_page={{ per_page }}">Dernier &raquo;</a>
    {% endif %}
  </div>
</div>
