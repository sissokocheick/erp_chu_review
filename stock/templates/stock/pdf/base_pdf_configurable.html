{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>{% block pdf_title %}Document{% endblock %}</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   BASE PDF CONFIGURABLE — Styles globaux pour WeasyPrint
   ═══════════════════════════════════════════════════════════════════════════ */

* { margin: 0; padding: 0; box-sizing: border-box; }

@page {
    size: A4;
    margin: 10mm;
}

body {
    font-family: 'Times New Roman', Times, serif;
    font-size: 9pt;
    line-height: 1.3;
    color: #000;
}

/* Tableaux */
.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 8pt;
}
.data-table thead {
    display: table-header-group;
}
.data-table thead tr,
.data-table tbody tr {
    page-break-inside: avoid;
    break-inside: avoid;
}
.data-table th,
.data-table td {
    border: 1px solid #000;
    padding: 1.5mm;
    vertical-align: middle;
}
.data-table th {
    text-align: center;
    font-weight: bold;
    background-color: #f5f5f5;
}

/* Bloc bas indivisible */
.no-break-inside {
    page-break-inside: avoid;
    break-inside: avoid;
}

img { max-width: 100%; height: auto; }
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
