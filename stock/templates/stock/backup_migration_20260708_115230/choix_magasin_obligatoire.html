{% extends "base_ui.html" %}
{% block contenu %}

<div style="display: flex; justify-content: center; align-items: center; height: 75vh;">
    <div style="background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; border-top: 5px solid #1c5b96;">

        <i class="fas fa-warehouse" style="font-size: 55px; color: #1c5b96; margin-bottom: 20px;"></i>
        <h2 style="margin-top: 0; color: #333; font-size: 22px;">Choix du Magasin</h2>
        <p style="color: #666; margin-bottom: 30px; font-size: 14px; line-height: 1.5;">
            Ce module necessite de selectionner le magasin dans lequel vous souhaitez travailler aujourd'hui.
        </p>

        <form method="POST" action="{% url 'changer_magasin' %}">
            {% csrf_token %}

            <input type="hidden" name="next" value="{{ url_voulue }}">

            <div style="text-align: left; margin-bottom: 25px;">
                <label style="font-weight: bold; font-size: 13px; color: #444; margin-bottom: 8px; display: block;">Selectionnez votre magasin :</label>
                <select name="magasin_id" required class="form-control select2" style="width: 100%;">
                    <option value="">-- Cliquez pour choisir --</option>
                    {% for m in mes_magasins %}
                        <option value="{{ m.id }}">{{ m.nom|upper }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" style="background: #1c5b96; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; font-size: 15px; transition: 0.2s;">
                Acceder au module <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>
            </button>
        </form>
    </div>
</div>

{% endblock %}

{% block extra_scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof jQuery !== 'undefined' && typeof $.fn.select2 !== 'undefined') {
            $('select.select2').select2({
                placeholder: "-- Cliquez pour choisir --",
                allowClear: false,
                width: '100%'
            });
        }
    });
</script>
{% endblock %}
