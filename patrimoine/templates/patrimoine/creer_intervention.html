<!DOCTYPE html>
{% load static %}
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Signaler un problème - {{ immo.code_patrimoine }}</title>
    <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; color: #333; }
        .header { background: #dc3545; color: white; padding: 20px; text-align: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 4px 10px rgba(220,53,69,0.2); }
        .header h1 { margin: 0; font-size: 20px; }
        .header p { margin: 5px 0 0 0; opacity: 0.9; font-size: 13px; }
        
        .form-card { background: white; margin: 20px; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; color: #555; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .form-control { width: 100%; padding: 12px; border: 2px solid #eef0f3; border-radius: 10px; font-size: 15px; box-sizing: border-box; transition: 0.2s; font-family: inherit; background: #f8f9fa; }
        .form-control:focus { outline: none; border-color: #dc3545; background: white; box-shadow: 0 0 0 3px rgba(220,53,69,0.1); }
        textarea.form-control { resize: none; min-height: 120px; }
        
        .btn-submit { display: block; width: 100%; background: #dc3545; color: white; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(220,53,69,0.3); transition: 0.2s; }
        .btn-submit:active { transform: scale(0.98); }
        
        .btn-cancel { display: block; width: 100%; text-align: center; color: #6c757d; text-decoration: none; padding: 15px; font-size: 14px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <i class="fas fa-tools" style="font-size: 36px; margin-bottom: 10px;"></i>
        <h1>Signaler une panne</h1>
        <p>{{ immo.nom_affichage }} ({{ immo.code_patrimoine }})</p>
    </div>

    <form method="POST" action="?mobile=1">
        {% csrf_token %}
        <div class="form-card">
            
            <div class="form-group">
                <label>Type d'intervention</label>
                <select name="type_intervention" class="form-control" required>
                    <option value="CURATIVE" selected>🚨 Réparation (Curative)</option>
                    <option value="PREVENTIVE">🔧 Entretien (Préventive)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Description du problème</label>
                <textarea name="description_probleme" class="form-control" placeholder="Ex: L'écran ne s'allume plus, il y a une odeur de brûlé..." required></textarea>
            </div>

            {% if contrats %}
            <div class="form-group">
                <label>Couvert par un contrat ?</label>
                <select name="contrat" class="form-control">
                    <option value="">Aucun contrat spécifique</option>
                    {% for c in contrats %}
                    <option value="{{ c.id }}">{{ c.prestataire.nom }} ({{ c.reference }})</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}

        </div>

        <div style="padding: 0 20px 30px 20px;">
            <button type="submit" class="btn-submit">
                <i class="fas fa-paper-plane" style="margin-right: 8px;"></i> Envoyer le signalement
            </button>
            <a href="{% url 'patrimoine_scan' immo.code_patrimoine %}" class="btn-cancel">Annuler</a>
        </div>
    </form>

</body>
</html>
