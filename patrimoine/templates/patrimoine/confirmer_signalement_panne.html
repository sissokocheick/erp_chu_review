<!DOCTYPE html>
{% load static %}
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerte envoyée</title>
    <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #28a745; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; text-align: center; }
        .icon { font-size: 80px; margin-bottom: 20px; animation: pop 0.5s ease; }
        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        h1 { margin: 0 0 10px; font-size: 24px; }
        p { font-size: 15px; opacity: 0.9; line-height: 1.5; }
    </style>
</head>
<body>
    <div>
        <div class="icon"><i class="fas fa-check-circle"></i></div>
        <h1>Alerte envoyée !</h1>
        <p>Merci pour votre signalement.<br>L'équipe technique a été notifiée et interviendra dans les plus brefs délais.</p>
        {% if intervention %}<p style="font-size:15px; font-weight:600;">Votre signalement n° <strong>#{{ intervention.id }}</strong> a bien été enregistré.</p>{% endif %}
        <p style="font-size:12px; margin-top:30px; opacity:0.7;">Vous pouvez fermer cette page.</p>
    </div>
</body>
</html>
