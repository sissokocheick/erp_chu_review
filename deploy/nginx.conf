# ═══════════════════════════════════════════════════════════════════════════
#  nginx_nexuserp.conf — Reverse proxy Nginx pour NexusERP
#
#  Installation :
#    sudo cp deploy/nginx.conf /etc/nginx/sites-available/nexuserp
#    sudo ln -sf /etc/nginx/sites-available/nexuserp /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  Variables à adapter :
#    - server_name : votre domaine (ex. erp.chu.example)
#    - APP_DIR     : chemin de l'application
#    - APP_PORT    : port gunicorn (défaut 8000)
# ═══════════════════════════════════════════════════════════════════════════

# ── Redirect HTTP → HTTPS (ou accès direct si pas de domaine) ──
# Pour un déploiement interne sans domaine (IP directes), commenter
# la redirection return 301 et utiliser le bloc HTTP unique ci-dessous.
server {
    listen 80;
    server_name erp.chu.example www.erp.chu.example
              192.168.0.29 192.168.35.32;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name erp.chu.example www.erp.chu.example
              192.168.0.29 192.168.35.32;

    # ── SSL (Let's Encrypt) ──
    ssl_certificate     /etc/letsencrypt/live/erp.chu.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.chu.example/privkey.pem;

    # Protocoles et ciphers sécurisés
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── En-têtes de sécurité ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # ── Uploads ──
    client_max_body_size 20M;

    # ── Fichiers statiques (servis directement, pas de proxy) ──
    location /static/ {
        alias /opt/erp_chu_review/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /opt/erp_chu_review/media/;
        expires 7d;
    }

    # ── Favicon ──
    location = /favicon.ico {
        alias /opt/erp_chu_review/static/favicon.ico;
        log_not_found off;
        access_log off;
    }

    # ── Healthcheck (pas d'auth, pas de log) ──
    location = /health/ {
        proxy_pass http://127.0.0.1:8000/health/;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Proxy vers Gunicorn ──
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }
}
