name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    name: Tests (suite complète)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Navigateur requis par les tests E2E Playwright (LiveServerTestCase)
          python -m playwright install --with-deps chromium

      - name: Migrations à jour (makemigrations --check)
        run: |
          DJANGO_SETTINGS_MODULE=config.settings_test python manage.py makemigrations --check --dry-run

      - name: Suite de tests complète (2351 tests, dont E2E)
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
          DJANGO_ALLOW_ASYNC_UNSAFE: '1'
          PYTHONIOENCODING: utf-8
        run: python manage.py test

  security:
    name: Sécurité (pip-audit + check --deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit

      - name: pip-audit (dépendances applicatives)
        run: pip-audit -r requirements.txt

      - name: Django check --deploy (mode production)
        env:
          DJANGO_DEBUG: 'False'
          DJANGO_SECRET_KEY: 'ci-only-dummy-key-0123456789abcdef0123456789abcdef0123456789abcdef'
          DB_PASSWORD: 'ci-only'
          DJANGO_ALLOWED_HOSTS: 'ci.example.org'
        run: python manage.py check --deploy

      - name: collectstatic (dry-run)
        env:
          DJANGO_DEBUG: 'True'
        run: python manage.py collectstatic --noinput --dry-run

  # Alerte sur échec CI : un seul message par run échoué, envoyé à un
  # webhook Slack (ou compatible). Configurable via le secret
  # CI_ALERT_WEBHOOK — s'il est absent, l'alerte est ignorée proprement.
  alert:
    name: Alerte échec CI (Slack/webhook)
    runs-on: ubuntu-latest
    needs: [tests, security]
    if: failure()
    steps:
      - name: Envoyer l'alerte
        env:
          WEBHOOK_URL: ${{ secrets.CI_ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          JOB_URLS: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "::warning::Secret CI_ALERT_WEBHOOK non configuré — alerte ignorée."
            echo "Créer un Incoming Webhook Slack puis définir le secret CI_ALERT_WEBHOOK."
            exit 0
          fi

          # Construit le message JSON (échappement propre via Python)
          payload=$(python3 - "$REPO" "$BRANCH" "$SHA" "$RUN_URL" <<'PYEOF'
          import json, sys
          repo, branch, sha, run_url = sys.argv[1:5]
          message = (
              f"\u26d4 *CI \u00e9chou\u00e9e* \u2014 {repo}\n"
              f"\u2022 Branche : `{branch}`\n"
              f"\u2022 Commit : `{sha[:7]}`\n"
              f"\u2022 Run : {run_url}\n"
              f"Un des jobs (Tests / S\u00e9curit\u00e9) a \u00e9chou\u00e9. Voir le d\u00e9tail dans GitHub Actions."
          )
          print(json.dumps({"text": message}))
          PYEOF
          )

          curl -sS -X POST -H "Content-Type: application/json" \
            -d "$payload" "$WEBHOOK_URL"
          echo "\nAlerte envoy\u00e9e au webhook."
